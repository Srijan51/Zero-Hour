<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E0E7FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Full bleed background for maskable icon (no rounded corners) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Content within safe zone (inner 80% = 51.2px padding each side) -->
  <g transform="translate(256,256) scale(0.72) translate(-256,-256)">
    <!-- Subtle ring -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
    <!-- Clock markers -->
    <circle cx="256" cy="86" r="6" fill="rgba(255,255,255,0.3)"/>
    <circle cx="426" cy="256" r="6" fill="rgba(255,255,255,0.3)"/>
    <circle cx="256" cy="426" r="6" fill="rgba(255,255,255,0.3)"/>
    <circle cx="86" cy="256" r="6" fill="rgba(255,255,255,0.3)"/>
    <!-- Lightning bolt -->
    <g filter="url(#glow)">
      <polygon points="280,110 220,270 270,270 232,400 312,230 262,230 280,110" fill="url(#bolt)" opacity="0.95"/>
    </g>
    <!-- Accent dot -->
    <circle cx="256" cy="256" r="8" fill="white" opacity="0.6"/>
  </g>
</svg>
